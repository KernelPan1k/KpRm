[package]
name = "kprm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "kprm"
path = "src/main.rs"
# No #[cfg(test)] code in this crate (all logic lives in kprm-engine/
# kprm-windows and is tested there) — and cargo's test harness for this
# bin would otherwise inherit the requireAdministrator manifest embedded
# by build.rs, refusing to even launch under `cargo test` (os error 740).
test = false

[features]
# Embeds an `asInvoker` manifest instead of `requireAdministrator` (see
# build.rs and assets/app.noadmin.manifest) — `cargo run -p kprm --features
# dev-noadmin` skips the UAC prompt for fast iteration on pure UI/layout
# work. Never enable this for a release build.
dev-noadmin = []

[dependencies]
kprm-catalog = { path = "../kprm-catalog" }
kprm-engine = { path = "../kprm-engine" }
kprm-i18n = { path = "../kprm-i18n" }
kprm-windows = { path = "../kprm-windows" }
kprm-win32gui = { path = "../kprm-win32gui" }
clap.workspace = true
arboard = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_GdiPlus",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
