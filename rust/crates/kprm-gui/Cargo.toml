[package]
name = "kprm-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "kprm-gui"
path = "src/main.rs"
# No #[cfg(test)] code in this crate (all logic lives in kprm-engine/
# kprm-windows and is tested there) — and cargo's test harness for this
# bin would otherwise inherit the requireAdministrator manifest embedded
# by build.rs, refusing to even launch under `cargo test` (os error 740).
test = false

[dependencies]
kprm-catalog = { path = "../kprm-catalog" }
kprm-engine = { path = "../kprm-engine" }
kprm-i18n = { path = "../kprm-i18n" }
kprm-windows = { path = "../kprm-windows" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
# Pinned: newer arboard versions pull clipboard-win >=5, which switched from
# the classic `winapi` crate (prebuilt GNU import libs, works here) to
# `windows-sys` >=0.60 (raw-dylib linking, needs a full `dlltool`+`as` this
# minimal rustup-provided GNU toolchain doesn't ship). 3.3.0 is the newest
# arboard still on the `winapi`-based clipboard-win 4.x line. See
# ../README.md.
arboard = "=3.3.0"

[build-dependencies]
embed-resource = "3"
